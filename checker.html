<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
  <meta charset="UTF-8"/>
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>Xiaomi IMEI Checker – فحص الأجهزة</title>
  <link href="https://fonts.googleapis.com/css2?family=Cairo:wght@400;600;700;900&display=swap" rel="stylesheet"/>
  <style>
    :root {
      --orange: #FF6900;
      --orange-light: #FF8C38;
      --dark: #0A0A0A;
      --darker: #050505;
      --card: #111111;
      --card2: #161616;
      --border: rgba(255,105,0,0.2);
      --text: #F0F0F0;
      --muted: #777;
      --green: #00D084;
      --red: #FF4545;
    }

    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

    body {
      font-family: 'Cairo', sans-serif;
      background: var(--darker);
      color: var(--text);
      min-height: 100vh;
    }

    /* Animated background */
    .bg-grid {
      position: fixed;
      inset: 0;
      background-image:
        linear-gradient(rgba(255,105,0,0.03) 1px, transparent 1px),
        linear-gradient(90deg, rgba(255,105,0,0.03) 1px, transparent 1px);
      background-size: 50px 50px;
      animation: gridMove 25s linear infinite;
      z-index: 0;
      pointer-events: none;
    }
    @keyframes gridMove {
      0%   { background-position: 0 0; }
      100% { background-position: 50px 50px; }
    }

    /* ===== NAVBAR ===== */
    .navbar {
      position: sticky; top: 0;
      z-index: 100;
      background: rgba(10,10,10,0.9);
      backdrop-filter: blur(20px);
      border-bottom: 1px solid var(--border);
      padding: 0 32px;
      height: 64px;
      display: flex;
      align-items: center;
      justify-content: space-between;
    }
    .nav-logo {
      display: flex;
      align-items: center;
      gap: 10px;
    }
    .mi-icon {
      width: 40px; height: 40px;
      background: var(--orange);
      border-radius: 10px;
      display: flex; align-items: center; justify-content: center;
      font-size: 18px; font-weight: 900;
      color: #fff;
      box-shadow: 0 0 20px rgba(255,105,0,0.4);
      animation: glow 2.5s ease-in-out infinite;
    }
    @keyframes glow {
      0%, 100% { box-shadow: 0 0 15px rgba(255,105,0,0.3); }
      50%       { box-shadow: 0 0 35px rgba(255,105,0,0.7); }
    }
    .nav-title { font-size: 18px; font-weight: 900; color: #fff; }
    .nav-title span { color: var(--orange); }
    .nav-right { display: flex; align-items: center; gap: 16px; }
    .nav-user {
      font-size: 13px; color: var(--muted);
      background: #1A1A1A;
      border: 1px solid #2A2A2A;
      border-radius: 20px;
      padding: 6px 14px;
    }
    .nav-user strong { color: var(--orange); }
    .btn-logout {
      background: transparent;
      border: 1px solid #333;
      border-radius: 20px;
      padding: 6px 16px;
      color: var(--muted);
      font-family: 'Cairo', sans-serif;
      font-size: 13px;
      cursor: pointer;
      transition: all 0.2s;
    }
    .btn-logout:hover { border-color: var(--red); color: var(--red); }

    /* ===== MAIN ===== */
    .main {
      position: relative;
      z-index: 10;
      max-width: 1100px;
      margin: 0 auto;
      padding: 40px 24px 60px;
    }

    /* Stats bar */
    .stats-bar {
      display: grid;
      grid-template-columns: repeat(3, 1fr);
      gap: 16px;
      margin-bottom: 32px;
    }
    .stat-card {
      background: var(--card);
      border: 1px solid var(--border);
      border-radius: 14px;
      padding: 20px;
      text-align: center;
      animation: fadeIn 0.5s both;
    }
    .stat-card:nth-child(2) { animation-delay: 0.1s; }
    .stat-card:nth-child(3) { animation-delay: 0.2s; }
    @keyframes fadeIn {
      from { opacity: 0; transform: translateY(16px); }
      to   { opacity: 1; transform: none; }
    }
    .stat-num { font-size: 28px; font-weight: 900; color: var(--orange); }
    .stat-label { font-size: 12px; color: var(--muted); margin-top: 4px; }

    /* Input section */
    .input-section {
      background: var(--card);
      border: 1px solid var(--border);
      border-radius: 18px;
      padding: 32px;
      margin-bottom: 24px;
      animation: fadeIn 0.6s 0.1s both;
    }
    .section-header {
      display: flex;
      align-items: center;
      gap: 12px;
      margin-bottom: 20px;
    }
    .section-icon {
      width: 38px; height: 38px;
      background: rgba(255,105,0,0.12);
      border: 1px solid rgba(255,105,0,0.3);
      border-radius: 10px;
      display: flex; align-items: center; justify-content: center;
      font-size: 18px;
    }
    .section-title { font-size: 18px; font-weight: 700; }
    .section-sub { font-size: 12px; color: var(--muted); margin-top: 2px; }

    .api-row {
      display: grid;
      grid-template-columns: 1fr auto;
      gap: 12px;
      margin-bottom: 20px;
      align-items: end;
    }
    .field-group { display: flex; flex-direction: column; gap: 6px; }
    .field-group label {
      font-size: 12px;
      font-weight: 600;
      color: var(--muted);
      letter-spacing: 1px;
      text-transform: uppercase;
    }
    .field-group input, .field-group select {
      background: #1A1A1A;
      border: 1px solid #2A2A2A;
      border-radius: 10px;
      padding: 12px 14px;
      color: var(--text);
      font-family: 'Cairo', sans-serif;
      font-size: 14px;
      outline: none;
      direction: ltr;
      transition: border-color 0.2s, box-shadow 0.2s;
    }
    .field-group input:focus, .field-group select:focus {
      border-color: var(--orange);
      box-shadow: 0 0 0 3px rgba(255,105,0,0.1);
    }
    select option { background: #1A1A1A; }

    textarea {
      width: 100%;
      background: #1A1A1A;
      border: 1px solid #2A2A2A;
      border-radius: 12px;
      padding: 16px;
      color: var(--text);
      font-family: 'Cairo', sans-serif;
      font-size: 14px;
      resize: vertical;
      min-height: 180px;
      outline: none;
      direction: ltr;
      line-height: 1.8;
      transition: border-color 0.2s, box-shadow 0.2s;
    }
    textarea:focus {
      border-color: var(--orange);
      box-shadow: 0 0 0 3px rgba(255,105,0,0.1);
    }
    textarea::placeholder { color: #333; }

    .textarea-footer {
      display: flex;
      justify-content: space-between;
      align-items: center;
      margin-top: 10px;
    }
    .imei-count {
      font-size: 12px;
      color: var(--muted);
    }
    .imei-count span { color: var(--orange); font-weight: 700; }
    .imei-count.over span { color: var(--red); }

    .btn-row {
      display: flex;
      gap: 12px;
      margin-top: 20px;
    }
    .btn-check {
      flex: 1;
      padding: 14px;
      background: linear-gradient(135deg, var(--orange), var(--orange-light));
      border: none;
      border-radius: 10px;
      color: #fff;
      font-family: 'Cairo', sans-serif;
      font-size: 16px;
      font-weight: 700;
      cursor: pointer;
      position: relative;
      overflow: hidden;
      transition: transform 0.15s, box-shadow 0.2s;
      letter-spacing: 0.5px;
    }
    .btn-check:hover {
      transform: translateY(-2px);
      box-shadow: 0 8px 30px rgba(255,105,0,0.4);
    }
    .btn-check:disabled {
      opacity: 0.5;
      cursor: not-allowed;
      transform: none;
    }
    .btn-shine {
      position: absolute;
      top: 0; left: -100%;
      width: 60%; height: 100%;
      background: linear-gradient(90deg, transparent, rgba(255,255,255,0.2), transparent);
      animation: shine 3s infinite;
    }
    @keyframes shine {
      0%   { left: -100%; }
      20%  { left: 120%; }
      100% { left: 120%; }
    }
    .btn-clear {
      padding: 14px 20px;
      background: #1A1A1A;
      border: 1px solid #2A2A2A;
      border-radius: 10px;
      color: var(--muted);
      font-family: 'Cairo', sans-serif;
      font-size: 14px;
      cursor: pointer;
      transition: all 0.2s;
    }
    .btn-clear:hover { border-color: var(--red); color: var(--red); }

    /* ===== RESULTS ===== */
    .results-section {
      display: none;
      animation: fadeIn 0.5s both;
    }
    .results-header {
      display: flex;
      align-items: center;
      justify-content: space-between;
      margin-bottom: 16px;
    }
    .results-title { font-size: 18px; font-weight: 700; }
    .btn-export {
      padding: 8px 18px;
      background: transparent;
      border: 1px solid var(--orange);
      border-radius: 8px;
      color: var(--orange);
      font-family: 'Cairo', sans-serif;
      font-size: 13px;
      cursor: pointer;
      transition: all 0.2s;
    }
    .btn-export:hover { background: rgba(255,105,0,0.1); }

    .results-table-wrap {
      background: var(--card);
      border: 1px solid var(--border);
      border-radius: 14px;
      overflow: hidden;
    }
    table {
      width: 100%;
      border-collapse: collapse;
      direction: ltr;
    }
    thead { background: #1A1A1A; }
    th {
      padding: 14px 16px;
      font-size: 12px;
      font-weight: 700;
      color: var(--muted);
      text-align: left;
      letter-spacing: 1px;
      text-transform: uppercase;
    }
    td {
      padding: 14px 16px;
      font-size: 13px;
      border-top: 1px solid #1A1A1A;
    }
    tr:hover td { background: rgba(255,105,0,0.03); }
    .status-badge {
      display: inline-flex;
      align-items: center;
      gap: 6px;
      padding: 4px 10px;
      border-radius: 20px;
      font-size: 12px;
      font-weight: 600;
    }
    .status-ok   { background: rgba(0,208,132,0.12); color: var(--green); border: 1px solid rgba(0,208,132,0.3); }
    .status-err  { background: rgba(255,69,69,0.12); color: var(--red); border: 1px solid rgba(255,69,69,0.3); }
    .status-wait { background: rgba(255,105,0,0.12); color: var(--orange); border: 1px solid rgba(255,105,0,0.3); }

    /* Progress overlay */
    .progress-overlay {
      display: none;
      position: fixed;
      inset: 0;
      background: rgba(0,0,0,0.7);
      backdrop-filter: blur(8px);
      z-index: 999;
      align-items: center;
      justify-content: center;
    }
    .progress-box {
      background: var(--card);
      border: 1px solid var(--border);
      border-radius: 20px;
      padding: 40px 48px;
      text-align: center;
      min-width: 320px;
    }
    .spinner {
      width: 56px; height: 56px;
      border: 3px solid #2A2A2A;
      border-top-color: var(--orange);
      border-radius: 50%;
      margin: 0 auto 20px;
      animation: spin 0.8s linear infinite;
    }
    @keyframes spin { to { transform: rotate(360deg); } }
    .progress-label { font-size: 16px; font-weight: 600; margin-bottom: 16px; }
    .progress-bar-wrap {
      background: #1A1A1A;
      border-radius: 20px;
      height: 6px;
      overflow: hidden;
    }
    .progress-bar {
      height: 100%;
      background: linear-gradient(90deg, var(--orange), var(--orange-light));
      border-radius: 20px;
      transition: width 0.3s;
      width: 0%;
    }
    .progress-count { font-size: 12px; color: var(--muted); margin-top: 10px; }

    /* Responsive */
    @media (max-width: 640px) {
      .stats-bar { grid-template-columns: 1fr; }
      .api-row { grid-template-columns: 1fr; }
      .navbar { padding: 0 16px; }
      .main { padding: 24px 16px; }
    }
  </style>
</head>
<body>
  <div class="bg-grid"></div>

  <!-- NAVBAR -->
  <nav class="navbar">
    <div class="nav-logo">
      <div class="mi-icon">Mi</div>
      <div class="nav-title">Xiaomi <span>IMEI</span> Checker</div>
    </div>
    <div class="nav-right">
      <div class="nav-user">مرحباً، <strong>Mohamed</strong></div>
      <button class="btn-logout" onclick="logout()">تسجيل الخروج</button>
    </div>
  </nav>

  <!-- MAIN -->
  <div class="main">

    <!-- Stats -->
    <div class="stats-bar">
      <div class="stat-card">
        <div class="stat-num" id="statTotal">0</div>
        <div class="stat-label">إجمالي الأرقام المدخلة</div>
      </div>
      <div class="stat-card">
        <div class="stat-num" id="statSuccess" style="color:var(--green)">0</div>
        <div class="stat-label">فحص ناجح</div>
      </div>
      <div class="stat-card">
        <div class="stat-num" id="statFail" style="color:var(--red)">0</div>
        <div class="stat-label">فحص فاشل</div>
      </div>
    </div>

    <!-- Input card -->
    <div class="input-section">
      <div class="section-header">
        <div class="section-icon">🔍</div>
        <div>
          <div class="section-title">فحص IMEI</div>
          <div class="section-sub">أدخل حتى 200 رقم IMEI للفحص دفعة واحدة</div>
        </div>
      </div>

      <!-- API config -->
      <div class="api-row">
        <div class="field-group" style="flex:1">
          <label>رابط الـ API الخاص بك</label>
          <input type="text" id="apiUrl" placeholder="https://your-api.com/check?imei=" dir="ltr"/>
        </div>
        <div class="field-group">
          <label>طريقة الإرسال</label>
          <select id="apiMethod">
            <option value="GET">GET</option>
            <option value="POST">POST</option>
          </select>
        </div>
      </div>
      <div class="field-group" style="margin-bottom:20px">
        <label>مفتاح API (اختياري)</label>
        <input type="password" id="apiKey" placeholder="أدخل مفتاح الـ API إن وجد" dir="ltr"/>
      </div>

      <!-- IMEI textarea -->
      <div class="field-group">
        <label>أرقام IMEI (رقم واحد في كل سطر)</label>
        <textarea id="imeiInput" placeholder="352999111234567&#10;490154203237518&#10;012345678901234&#10;..." oninput="countIMEI()"></textarea>
      </div>
      <div class="textarea-footer">
        <div class="imei-count" id="imeiCounter">
          <span>0</span> / 200 رقم IMEI
        </div>
        <div style="font-size:12px;color:var(--muted)">كل رقم IMEI في سطر منفصل</div>
      </div>

      <div class="btn-row">
        <button class="btn-check" id="btnCheck" onclick="startCheck()">
          <span class="btn-shine"></span>
          🚀 بدء الفحص
        </button>
        <button class="btn-clear" onclick="clearAll()">🗑 مسح الكل</button>
      </div>
    </div>

    <!-- Results -->
    <div class="results-section" id="resultsSection">
      <div class="results-header">
        <div class="results-title">📊 نتائج الفحص</div>
        <button class="btn-export" onclick="exportCSV()">⬇ تصدير CSV</button>
      </div>
      <div class="results-table-wrap">
        <table>
          <thead>
            <tr>
              <th>#</th>
              <th>رقم IMEI</th>
              <th>الحالة</th>
              <th>نتيجة الفحص</th>
            </tr>
          </thead>
          <tbody id="resultsBody"></tbody>
        </table>
      </div>
    </div>
  </div>

  <!-- Progress overlay -->
  <div class="progress-overlay" id="progressOverlay">
    <div class="progress-box">
      <div class="spinner"></div>
      <div class="progress-label">جارٍ فحص الأرقام...</div>
      <div class="progress-bar-wrap">
        <div class="progress-bar" id="progressBar"></div>
      </div>
      <div class="progress-count" id="progressCount">0 / 0</div>
    </div>
  </div>

  <script>
    // ===== AUTH GUARD =====
    if (!sessionStorage.getItem('auth')) window.location.href = 'index.html';

    // ===== RESULTS store (in-memory only, never persisted) =====
    let allResults = [];

    // ===== IMEI Counter =====
    function countIMEI() {
      const lines = getIMEIs();
      const counter = document.getElementById('imeiCounter');
      const span = counter.querySelector('span');
      span.textContent = lines.length;
      if (lines.length > 200) counter.classList.add('over');
      else counter.classList.remove('over');
    }

    function getIMEIs() {
      return document.getElementById('imeiInput').value
        .split('\n')
        .map(l => l.trim())
        .filter(l => l.length > 0);
    }

    // ===== MAIN CHECK FUNCTION =====
    async function startCheck() {
      const imeis = getIMEIs();
      const apiUrl = document.getElementById('apiUrl').value.trim();
      const apiKey = document.getElementById('apiKey').value.trim();
      const method = document.getElementById('apiMethod').value;

      if (!apiUrl) { alert('⚠️ يرجى إدخال رابط الـ API أولاً'); return; }
      if (imeis.length === 0) { alert('⚠️ يرجى إدخال أرقام IMEI للفحص'); return; }
      if (imeis.length > 200) { alert('⚠️ الحد الأقصى 200 رقم IMEI في المرة الواحدة'); return; }

      // Show progress
      const overlay = document.getElementById('progressOverlay');
      const progressBar = document.getElementById('progressBar');
      const progressCount = document.getElementById('progressCount');
      overlay.style.display = 'flex';

      allResults = [];
      const tbody = document.getElementById('resultsBody');
      tbody.innerHTML = '';
      document.getElementById('resultsSection').style.display = 'block';

      let success = 0, fail = 0;

      for (let i = 0; i < imeis.length; i++) {
        const imei = imeis[i];
        progressCount.textContent = `${i + 1} / ${imeis.length}`;
        progressBar.style.width = `${((i + 1) / imeis.length) * 100}%`;

        // Add pending row
        const row = document.createElement('tr');
        row.id = `row-${i}`;
        row.innerHTML = `
          <td>${i + 1}</td>
          <td style="font-family:monospace;letter-spacing:1px">${imei}</td>
          <td><span class="status-badge status-wait">⏳ جارٍ الفحص</span></td>
          <td>—</td>
        `;
        tbody.appendChild(row);

        try {
          let result;
          if (method === 'GET') {
            const headers = apiKey ? { 'Authorization': `Bearer ${apiKey}` } : {};
            const resp = await fetch(`${apiUrl}${imei}`, { headers });
            result = await resp.json().catch(() => resp.text().then(t => ({ raw: t })));
          } else {
            const headers = { 'Content-Type': 'application/json' };
            if (apiKey) headers['Authorization'] = `Bearer ${apiKey}`;
            const resp = await fetch(apiUrl, {
              method: 'POST',
              headers,
              body: JSON.stringify({ imei, key: apiKey || undefined })
            });
            result = await resp.json().catch(() => resp.text().then(t => ({ raw: t })));
          }

          const displayResult = formatResult(result);
          row.innerHTML = `
            <td>${i + 1}</td>
            <td style="font-family:monospace;letter-spacing:1px;color:var(--orange)">${imei}</td>
            <td><span class="status-badge status-ok">✅ تم الفحص</span></td>
            <td style="max-width:400px;word-break:break-word;font-size:12px;color:#ccc">${displayResult}</td>
          `;
          allResults.push({ imei, status: 'success', result: displayResult });
          success++;
        } catch (err) {
          row.innerHTML = `
            <td>${i + 1}</td>
            <td style="font-family:monospace;letter-spacing:1px">${imei}</td>
            <td><span class="status-badge status-err">❌ خطأ</span></td>
            <td style="color:var(--red);font-size:12px">${err.message}</td>
          `;
          allResults.push({ imei, status: 'error', result: err.message });
          fail++;
        }

        // Update stats
        document.getElementById('statTotal').textContent = i + 1;
        document.getElementById('statSuccess').textContent = success;
        document.getElementById('statFail').textContent = fail;

        // Small delay to not hammer API
        await sleep(300);
      }

      overlay.style.display = 'none';
    }

    function formatResult(result) {
      if (typeof result === 'string') return escapeHtml(result);
      // Try to extract common fields
      const keys = ['status','blacklist','carrier','model','brand','country','simlock','warranty','activation','result','message','data'];
      let parts = [];
      for (const k of keys) {
        if (result[k] !== undefined) parts.push(`<b>${k}:</b> ${escapeHtml(String(result[k]))}`);
      }
      if (parts.length) return parts.join(' &nbsp;|&nbsp; ');
      return escapeHtml(JSON.stringify(result).substring(0, 300));
    }

    function escapeHtml(s) {
      return s.replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;');
    }

    function sleep(ms) { return new Promise(r => setTimeout(r, ms)); }

    // ===== EXPORT CSV =====
    function exportCSV() {
      if (!allResults.length) return;
      const rows = [['#','IMEI','Status','Result']];
      allResults.forEach((r, i) => rows.push([i+1, r.imei, r.status, r.result.replace(/<[^>]+>/g,'')]));
      const csv = rows.map(r => r.map(c => `"${String(c).replace(/"/g,'""')}"`).join(',')).join('\n');
      const blob = new Blob(['\uFEFF' + csv], { type: 'text/csv;charset=utf-8;' });
      const a = document.createElement('a');
      a.href = URL.createObjectURL(blob);
      a.download = `imei_results_${new Date().toISOString().slice(0,10)}.csv`;
      a.click();
    }

    // ===== CLEAR =====
    function clearAll() {
      document.getElementById('imeiInput').value = '';
      document.getElementById('resultsBody').innerHTML = '';
      document.getElementById('resultsSection').style.display = 'none';
      document.getElementById('statTotal').textContent = '0';
      document.getElementById('statSuccess').textContent = '0';
      document.getElementById('statFail').textContent = '0';
      allResults = [];
      countIMEI();
    }

    // ===== LOGOUT =====
    function logout() {
      sessionStorage.removeItem('auth');
      window.location.href = 'index.html';
    }
  </script>
</body>
</html>
